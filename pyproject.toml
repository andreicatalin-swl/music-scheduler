[tool.poetry]
name = "school-sound-system"
version = "0.0.1"
description = ""
authors = ["Olariu Andrei Cătălin <andreicatalin.swl@gmail.com>"]
license = "None"
readme = "README.md"
packages = [
    { include = "schoolsoundsystem", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.13,<3.15"
apscheduler = "^3.11.0"
pygame = "^2.6.1"
pillow = "^11.3.0"
appdirs = "^1.4.4"
pyglet = "^2.1.8"
concurrent-log-handler = "^0.9.28"

[tool.poetry.group.dev.dependencies]
pyinstaller = "^6.16.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
